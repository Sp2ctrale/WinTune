[package]
name = "wintune"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "wintune"
path = "src/lib.rs"

[[bin]]
name = "WinTune"
path = "src/main.rs"
# The binary carries the requireAdministrator manifest: its (empty) test
# harness could not start from a non-elevated terminal. Tests live in the lib.
test = false

[dependencies]
eframe = "0.29"
egui = "0.29"
ab_glyph = "0.2"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }
ico = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
regex = "1.11"
quick-xml = "0.41"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
