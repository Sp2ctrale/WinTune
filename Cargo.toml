
[package]
name = "wintune"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "WinTune"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
] }
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }
ico = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
memmap2 = "0.9"
regex = "1.11"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
